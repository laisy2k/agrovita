{% extends "base.html" %}

{% block content %}

<div class="container">
    <h1>Editar usuário</h1>

    <form method="POST">
        <label for="nome">Nome</label>
        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ usuario['nome'] }}"
            required
        >

        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ usuario['email'] }}"
            required
        >

        <label for="tipo">Tipo de usuário</label>
        <select id="tipo" name="tipo" required>
            <option value="usuario"
                {% if usuario["tipo"] == "usuario" %}selected{% endif %}>
                Usuário comum
            </option>

            <option value="admin"
                {% if usuario["tipo"] == "admin" %}selected{% endif %}>
                Administrador
            </option>
        </select>

        <button type="submit">Salvar alterações</button>
    </form>

    <a href="{{ url_for('usuarios') }}">Voltar</a>
</div>

{% endblock %}
