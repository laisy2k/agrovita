{% extends "base.html" %}

{% block content %}

<div class="login-container">
    <h1>Entrar no AgroVita</h1>
    <p>Acesse sua conta para gerenciar seus animais.</p>

    {% if erro %}
        <p class="login-erro">{{ erro }}</p>
    {% endif %}

    <form method="POST">
        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="senha">Senha</label>
        <input
            type="password"
            id="senha"
            name="senha"
            required
        >

        <button type="submit">Entrar</button>
    </form>
</div>

{% endblock %}
