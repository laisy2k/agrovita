<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Sistema Agro{% endblock %}
    </title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">



</head>


<body>

    <header class="header">

    <div class="container header-content">

        <div class="logo">
            <img
                src="{{ url_for('static', filename='img/logo-agrovita.png') }}"
                alt="AgroVita - Controle Sanitário"
                class="logo-img"
            >
        </div>

{% if session.get("usuario_id") %}

    <button
        class="menu-toggle"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        onclick="toggleMenu()"
    >
        ☰
    </button>

    <nav class="nav" id="nav-menu">
        <a href="{{ url_for('inicio') }}">Início</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>

        {% if session.get("usuario_tipo") == "admin" %}
            <a href="{{ url_for('usuarios') }}">Usuários</a>
        {% endif %}

        <a href="{{ url_for('cadastro') }}">Animais</a>
        <a href="{{ url_for('vacinacao') }}">Vacinação</a>
        <a href="{{ url_for('manejo') }}">Manejo</a>
        <a href="{{ url_for('listagem') }}">Registros</a>
        <a href="{{ url_for('logout') }}">Sair</a>
    </nav>

{% endif %}

    </div>

</header>

    <main class="container main-content">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                AgroVita — Sistema de Controle e Manejo Sanitário
            </p>

            <span>
                Projeto acadêmico
            </span>

        </div>

    </footer>

<script>
    function toggleMenu() {
        const menu = document.getElementById("nav-menu");
        const button = document.querySelector(".menu-toggle");

        menu.classList.toggle("active");
        document.body.classList.toggle("menu-open");

        const aberto = menu.classList.contains("active");

        button.setAttribute("aria-expanded", aberto);
        button.textContent = aberto ? "✕" : "☰";
    }
</script>

</body>

</html>
